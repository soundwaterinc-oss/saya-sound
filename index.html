<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SAYA / 紗綾形 Sound Engine</title>
  <style>
    :root {
      --bg: #0a0a0c;
      --gold: #c8a24a;
      --gold-dim: #6b5526;
      --vermilion: #b3402f;
      --ink: #e9e2cf;
      --panel: #131318;
      --panel-border: #2a241a;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
      font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif; }
    #app { display: grid; grid-template-columns: 1fr 360px; height: 100vh; }
    @media (max-width: 860px) { #app { grid-template-columns: 1fr; grid-template-rows: 45vh 1fr; } }

    #stage { position: relative; display: flex; flex-direction: column; min-height: 0;
      border-right: 1px solid var(--panel-border); }
    #title { padding: 14px 18px 6px; }
    #title h1 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: .12em; color: var(--gold); }
    #title p { margin: 2px 0 0; font-size: 11px; color: var(--gold-dim); letter-spacing: .04em; }
    #saya-canvas { flex: 1; width: 100%; min-height: 0; display: block; }

    #saya-controls { overflow-y: auto; padding: 12px; background: #08080a; }
    .saya-section { background: var(--panel); border: 1px solid var(--panel-border);
      border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; }
    .saya-section h3 { margin: 0 0 8px; font-size: 11px; font-weight: 600; letter-spacing: .14em;
      text-transform: uppercase; color: var(--gold); border-bottom: 1px solid var(--panel-border); padding-bottom: 5px; }
    .saya-transport { display: flex; gap: 6px; flex-wrap: wrap; }

    .saya-btn { background: #1c1a14; color: var(--ink); border: 1px solid var(--panel-border);
      border-radius: 6px; padding: 7px 12px; font-size: 12px; cursor: pointer; letter-spacing: .04em; }
    .saya-btn:hover { border-color: var(--gold); color: var(--gold); }
    .saya-btn.primary { background: var(--gold); color: #1a1408; font-weight: 700; border-color: var(--gold); }
    .saya-btn.primary:hover { background: #d9b96a; }

    .saya-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 6px 0; }
    .saya-label { font-size: 11px; color: #b9af96; }
    .saya-select { background: #1c1a14; color: var(--ink); border: 1px solid var(--panel-border);
      border-radius: 5px; padding: 4px 6px; font-size: 11px; max-width: 60%; }

    .saya-slider { margin: 7px 0; }
    .saya-slider.mini { display: inline-block; width: calc(50% - 6px); margin: 4px 3px; vertical-align: top; }
    .saya-slider-head { display: flex; justify-content: space-between; font-size: 11px; color: #b9af96; margin-bottom: 3px; }
    .saya-val { color: var(--gold); font-variant-numeric: tabular-nums; }
    input[type=range] { width: 100%; accent-color: var(--gold); height: 3px; }

    .saya-seg { display: flex; gap: 0; margin-bottom: 8px; }
    .saya-segbtn { flex: 1; background: #1c1a14; color: #b9af96; border: 1px solid var(--panel-border);
      padding: 6px; font-size: 11px; cursor: pointer; }
    .saya-segbtn:first-child { border-radius: 5px 0 0 5px; }
    .saya-segbtn:last-child { border-radius: 0 5px 5px 0; }
    .saya-segbtn.active { background: var(--gold); color: #1a1408; font-weight: 600; }

    .saya-scanner { display: flex; align-items: center; gap: 8px; margin: 6px 0; flex-wrap: wrap; }
    .saya-scanner .saya-slider, .saya-scanner .saya-row { flex: 1; margin: 0; }

    .saya-toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; cursor: pointer; margin: 4px 8px 4px 0; }
    .saya-toggle input { accent-color: var(--gold); }

    .saya-drop { border: 1px dashed var(--gold-dim); border-radius: 8px; padding: 22px 12px;
      text-align: center; font-size: 12px; color: #b9af96; cursor: pointer; margin-bottom: 8px; }
    .saya-drop.over { border-color: var(--gold); color: var(--gold); background: #15130d; }
    .saya-status { font-size: 10px; color: var(--gold-dim); margin-top: 6px; min-height: 12px; }

    #saya-controls::-webkit-scrollbar { width: 8px; }
    #saya-controls::-webkit-scrollbar-thumb { background: #2a241a; border-radius: 4px; }
  </style>
</head>
<body>
  <div id="app">
    <div id="stage">
      <div id="title">
        <h1>SAYA 紗綾形</h1>
        <p>EL-SYSTEMA 第2号機 · 直交格子 × 打鳴(Modal) × カノン</p>
      </div>
      <canvas id="saya-canvas"></canvas>
    </div>
    <div id="saya-controls"></div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
